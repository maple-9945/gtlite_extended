# Configuration file

general {

    instance {
    }

    ##########################################################################################################
    # client options
    #--------------------------------------------------------------------------------------------------------#
    # Config options for Client-side rendering features
    ##########################################################################################################

    "client options" {
        # Hide the painting color for Color-Based Distinct support buses or hatches.
        # Default: false
        B:"Hide Multiblock Part Body Color"=false

        ##########################################################################################################
        # shader options
        #--------------------------------------------------------------------------------------------------------#
        # Config options for Shaders and Post-processing Effects
        ##########################################################################################################

        "shader options" {

            ##########################################################################################################
            # antimatter forge
            #--------------------------------------------------------------------------------------------------------#
            # Bloom config options for the Antimatter Forge.
            ##########################################################################################################

            "antimatter forge" {
                # Whether to render the Antimatter Forge core, protomatter beam and glow ring.
                # Disabling this removes the whole bloom effect while keeping the machine functional.
                # Default: true
                B:"Enable Antimatter Forge Effect"=true

                # The base brightness of the bloom. It is similar to strength.
                # This value should be smaller than highBrightnessThreshold.
                # Default: 0.0
                # Min: 0.0
                # Max: 1.7976931348623157E308
                D:baseBrightness=0.0

                # Bloom Algorithm
                # 0 - Simple Gaussian Blur Bloom (Fast)
                # 1 - Unity Bloom
                # 2 - Unreal Bloom
                # Default: 2
                # Min: 0
                # Max: 2
                I:bloomStyle=2

                # The brightness after bloom should not exceed this value. It can be used to limit the brightness of highlights
                # (e.g., daytime).
                # This value should be greater than lowBrightnessThreshold.
                # Default: 1.3
                # Min: 0.0
                # Max: 1.7976931348623157E308
                D:highBrightnessThreshold=1.3

                # The brightness after bloom should not be smaller than this value. It can be used to limit the brightness of dusky
                # parts (e.g., night/caves).
                # This value should be smaller than highBrightnessThreshold.
                # Default: 0.3
                # Min: 0.0
                # Max: 1.7976931348623157E308
                D:lowBrightnessThreshold=0.3

                # Bloom Strength
                # OUTPUT = BACKGROUND + BLOOM * {strength} * (base + LT + (1 - BACKGROUND_BRIGHTNESS)*(HT-LT)))
                # Default: 1.5
                # Min: 0.0
                # Max: 1.7976931348623157E308
                D:strength=1.5
            }

        }

    }

    ##########################################################################################################
    # compatibility options
    #--------------------------------------------------------------------------------------------------------#
    # Config options for Mod Compatibility features
    ##########################################################################################################

    "compatibility options" {

        ##########################################################################################################
        # jei compat options
        #--------------------------------------------------------------------------------------------------------#
        # Config options regarding JustEnoughItems (JEI) mod
        ##########################################################################################################

        "jei compat options" {
            # Make the Font Renderer in all pages be scaleable, it is useful for some large digits.
            # Default: true
            B:scaleableFontRenderer=true
        }

        ##########################################################################################################
        # ae2 compat options
        #--------------------------------------------------------------------------------------------------------#
        # Config options regarding Applied Energistics 2 (AE2) mod
        ##########################################################################################################

        "ae2 compat options" {
            # Add Circuit Assembly Line (CAL) recipes for all AE2 processors.
            # Default: true
            B:addProcessorCALRecipes=true
        }

    }

    ##########################################################################################################
    # machine options
    #--------------------------------------------------------------------------------------------------------#
    # Config options for GregTech Lite Machines, Pipes and Cables
    ##########################################################################################################

    "machine options" {

        ##########################################################################################################
        # energy infuser options
        #--------------------------------------------------------------------------------------------------------#
        # Modifiable settings for Energy Infuser, consists of:
        # - Maximum repaired damage,
        # - Consumed energy count,
        # - Consumed UU Matter amount.
        ##########################################################################################################

        "energy infuser options" {
            # Energy consumed (GTEU) per one durability which be repaired in Energy Infuser
            # Default: 1000
            # Min: 1
            # Max: 2147483647
            I:"Energy Consumed Per Durability"=1000

            # Maximum repaired durability of Energy Infuser per work.
            # Default: 1000
            # Min: 1
            # Max: 2147483647
            I:"Maximum Durability Repair Per work"=1000

            # UU Matter consumed per one durability which be repaired in Energy Infuser
            # Default: 1
            # Min: 1
            # Max: 2147483647
            I:"UU Matter Consumed Per Durability"=1
        }

        ##########################################################################################################
        # large fisher options
        #--------------------------------------------------------------------------------------------------------#
        # Modifiable settings for Large Fisher, consists of:
        # - Maximum progress time per cycle,
        # - Minimum water block fill count in structure.
        ##########################################################################################################

        "large fisher options" {
            # The water fill count in Large Fisher structure for working
            # Default: 60
            # Min: 1
            # Max: 98
            I:"Minimum Water Fill Count"=60

            # The progress time for Large Fisher each cycle working consumed
            # Default: 20 (1s)
            # Min: 1
            # Max: 2147483647
            I:"Progress Time Per Cycle"=20
        }

    }

    ##########################################################################################################
    # recipe options
    #--------------------------------------------------------------------------------------------------------#
    # Config options for GregTech Lite, GregTech and Vanilla Recipes
    ##########################################################################################################

    "recipe options" {
    }

    ##########################################################################################################
    # tool options
    #--------------------------------------------------------------------------------------------------------#
    # Config options for GregTech Lite Tools and Armors
    ##########################################################################################################

    "tool options" {

        ##########################################################################################################
        # laser destroyer options
        #--------------------------------------------------------------------------------------------------------#
        # Modifiable settings of Laser Destroyer tool
        ##########################################################################################################

        "laser destroyer options" {
            # The default capacity of Laser Destroyer
            # Default: 1,024,000 EU
            # Min: 0.0
            # Max: 9.223372036854776E18
            D:Capacity=1024000.0

            # The default energy tier of Laser Destroyer
            # Default: 2 (MV)
            # Min: 0
            # Max: 14
            I:"Energy Tier"=2

            # The mining time required for each Laser Destroyer mining tier in order.
            # Default: 0t, 8t, 20t, 40t
            I:"Mining Speeds" <
                0
                8
                20
                40
             >
        }

    }

    ##########################################################################################################
    # worldgen options
    #--------------------------------------------------------------------------------------------------------#
    # Config options for World Generation features
    ##########################################################################################################

    "worldgen options" {
        # Whether to disable all Berry Bushes world generation.
        # Default: false
        B:"Mod Berry Bush Generation"=false

        # Allowed to add Additional Items as loot in various structures.
        # Default: true
        B:"Mod Loot Table Addition"=true

        # Whether to disable all Addition Trees world generation.
        # Default: false
        B:"Mod Tree Generation"=false
    }

}


