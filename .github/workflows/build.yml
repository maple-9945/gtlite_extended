name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 换用 macOS 机器，默认 14GB 内存，彻底告别内存溢出(OOM)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自动下载缺失的 GT 依赖 jar
      - name: Download dev jars (GTCEu / GTLite Core / Morphism Lib)
        run: |
          set -euo pipefail
          mkdir -p libs
          BASE="https://raw.githubusercontent.com/GregTechLite/GregTech-Lite-Modpack/main/mods"

          echo "==> GTCEu master #2901"
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "libs/gregtech-1.12.2-master-2901.jar" \
            "$BASE/gregtech-1.12.2-master-%232901.jar"

          echo "==> GregTech Lite Core 1.0.0"
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "libs/gtlitecore-1.0.0.jar" \
            "$BASE/gtlitecore-1.0.0.jar"

          echo "==> Morphism Lib 1.0.0"
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "libs/morphismlib-1.12.2-1.0.0.jar" \
            "$BASE/morphismlib-1.12.2-1.0.0.jar"

      # 使用 JDK 17 编译，比 25 更稳定
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 移除本地路径的 Java 配置
      - name: Remove local org.gradle.java.home from gradle.properties
        run: |
          sed -i '' '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' gradle.properties || true
          grep -n "org.gradle" gradle.properties || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          # 将编译运行环境指向当前的 JDK 17
          export GRADLE_OPTS="-Dorg.gradle.java.home=${JAVA_HOME} ${GRADLE_OPTS:-}"
          # 强制 --no-daemon 避免守护进程驻留内存
          ./gradlew build --no-daemon --stacktrace

      - name: List built artifacts
        if: always()
        run: ls -la build/libs || true

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: gtlite_extended-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14