apply from: 'gradle/scripts/helpers.gradle'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal()
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // GTCEu（GTLite 整合包随包自编译构建，mcmod.info 版本 2.8.7-beta）
    implementation rfg.deobf(files('libs/gregtech-1.12.2-master-2901.jar'))
    // GregTech Lite Core
    implementation rfg.deobf(files('libs/gtlitecore-1.0.0.jar'))
    // Morphism Lib（GTLite Core 的 Meta 物品渲染依赖）
    implementation rfg.deobf(files('libs/morphismlib-1.12.2-1.0.0.jar'))

    // Had Enough Items（JEI 分支，modid=jei）4.36.1
    implementation rfg.deobf('curse.maven:had-enough-items-557549:9167450')
    // CodeChickenLib（GTCEu 的 mcmod.info 声明依赖）
    implementation rfg.deobf('curse.maven:codechicken-lib-1-8-242818:2779848')
    // ModularUI（GT 的 RecipeMapMultiblockController implements com.cleanroommc.modularui.api.IGuiHolder）
    implementation rfg.deobf('curse.maven:modularui-624243:7320544')
    // Forgelin Continuous（提供 Kotlin 运行时，GTLite Core 是 Kotlin 写的）
    implementation rfg.deobf('curse.maven:forgelin-continuous-456403:6983420')
    // MixinBooter（GTLite Core 的 EarlyMixinLoader 实现 zone.rong.mixinbooter.IEarlyMixinLoader）
    implementation rfg.deobf('curse.maven:mixin-booter-419286:7049694')
    // Applied Energistics 2 Extended Life（GTLite Core 的 MixinMetaTileEntityHolder 直接引用 AE2 类）
    implementation rfg.deobf('curse.maven:ae2-extended-life-570458:6302098')
}

if (!configurations.shade.dependencies.empty) {
    tasks.named('reobfJar').configure {
        inputJar.set(tasks.named('shadowJar').flatMap({ it.archiveFile }))
    }
}

tasks.shadowJar {
    enabled = !project.configurations.shade.dependencies.empty
    archiveClassifier = 'uberdev'
    configurations = [ project.configurations.shade ]
}
